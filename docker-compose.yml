services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: transact
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env (see .env.example)}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d transact"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    restart: unless-stopped

  # Dual listeners:
  #   - INTERNAL (kafka:29092) for containers on the compose network (the API uses this)
  #   - EXTERNAL (localhost:9092) for tools on the host machine
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    depends_on:
      zookeeper:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # MinIO (S3-compatible object store) for the optional `s3demo` source
  # profile (ADR-011). DEV-ONLY credentials. Host ports 19000/19001 avoid
  # common local collisions. The Bitnami image runs the daemon as uid 1001;
  # `user: "0"` only lets its entrypoint fix named-volume ownership on first
  # boot. The image ships `mc`, so the healthcheck uses `mc ready local`
  # (which reads MINIO_ROOT_USER/MINIO_ROOT_PASSWORD).
  # NOTE: MinIO removed their own images (minio/minio, minio/mc) from Docker
  # Hub; this is the verified pullable mirror (see README "Sources").
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    ports:
      # S3 API on 19000, web console on 19001.
      - "19000:9000"
      - "19001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/bitnami/minio/data
    user: "0"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # One-shot seed job, dev-only creds: uploads ./mock-s3 into the bucket the
  # s3demo profile reads (transact-sources). Safe to re-run
  # (--ignore-existing; cp -r overwrites in place).
  minio-seed:
    image: bitnamilegacy/minio-client:2025.7.21-debian-12-r3
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./mock-s3:/seed:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mc alias set local http://minio:9000 minioadmin minioadmin
        mc mb --ignore-existing local/transact-sources
        mc cp -r /seed/source-d local/transact-sources/
        echo "seeded"
    restart: "no"

  transaction-api:
    build: .
    # Explicit tag: CI prebuilds this image with buildx (GHA layer cache) and
    # runs `docker compose up` WITHOUT --build, so the stack reuses it instead
    # of rebuilding. Local usage is unchanged (compose builds + retags).
    image: evilcorp/transact:local
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/transact
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD must be set in .env and must equal POSTGRES_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      APP_SECURITY_JWT_SECRET: ${APP_SECURITY_JWT_SECRET:?APP_SECURITY_JWT_SECRET must be set in .env (see .env.example)}
      APP_INGESTION_INTERVAL_MS: ${APP_INGESTION_INTERVAL_MS:-60000}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
