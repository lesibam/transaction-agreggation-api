# Optional overlay: serves the API over local HTTPS using a self-signed dev
# certificate, generated by `./dev.sh certs`.
#
# Scope: this covers the API's OWN listener only. Postgres and Kafka traffic
# stay plaintext even with this overlay applied — encrypting those hops (and
# mTLS between services) is real work, tracked as open in
# IMPLEMENTATION_PLAN.md under "Phase 9: Bank Production Readiness". This
# overlay is a local-dev convenience, not a step toward that phase's bar.
#
# Usage:
#   ./dev.sh certs
#   ./dev.sh start --tls
#   curl -k https://localhost:8443/actuator/health
#
# (Not exercised by CI — CI's e2e-smoke job intentionally stays on the
# plaintext default so it matches the path this project's E2E harness has
# actually been verified against. Validate locally before relying on this.)

services:
  transaction-api:
    ports: !override
      - "8443:8443"
    environment:
      SERVER_PORT: "8443"
      SERVER_SSL_ENABLED: "true"
      SERVER_SSL_KEY_STORE: /certs/localhost.p12
      SERVER_SSL_KEY_STORE_TYPE: PKCS12
      SERVER_SSL_KEY_STORE_PASSWORD: ${SERVER_SSL_KEY_STORE_PASSWORD:?Run ./dev.sh certs first}
      SERVER_SSL_KEY_ALIAS: transact
    volumes:
      - ./certs:/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --no-check-certificate --spider https://localhost:8443/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s
