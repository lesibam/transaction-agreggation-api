{{/*
Refuse to render with an empty or still-default secret value, so the
"change-me-dev-only" placeholders in values.yaml can't silently ship to a
real cluster. Real deployments must override both with --set (from a
secrets manager, not shell history) or a values file that isn't committed.
See docs/principal_engineer_review_report.md M-06.
*/}}
{{- if or (empty .Values.secret.springDatasourcePassword) (eq .Values.secret.springDatasourcePassword "change-me-dev-only") }}
{{- fail "secret.springDatasourcePassword is unset or still the values.yaml placeholder default. Pass a real value: --set secret.springDatasourcePassword=<value>" }}
{{- end }}
{{- if or (empty .Values.secret.appSecurityJwtSecret) (eq .Values.secret.appSecurityJwtSecret "change-me-dev-only-jwt-secret-0123456789") }}
{{- fail "secret.appSecurityJwtSecret is unset or still the values.yaml placeholder default. Pass a real value: --set secret.appSecurityJwtSecret=<value>" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "transact.fullname" . }}-secret
  labels:
    app: transact
type: Opaque
stringData:
  SPRING_DATASOURCE_PASSWORD: {{ .Values.secret.springDatasourcePassword | quote }}
  APP_SECURITY_JWT_SECRET: {{ .Values.secret.appSecurityJwtSecret | quote }}
