<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Transact &middot; API Docs</title>
  <link rel="icon" href="/docs-assets/5.32.15/favicon-32x32.png" sizes="32x32" />
  <link rel="stylesheet" href="/docs-assets/5.32.15/swagger-ui.css" />
  <style>
    :root { --ink: #16212b; --paper: #eff2f4; --line: #2b4c6f; }
    body { margin: 0; background: var(--paper); }
    .topbar {
      display: flex; align-items: baseline; gap: 0.75rem;
      padding: 0.9rem 1.5rem; background: var(--ink); color: #eef1f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .topbar .wordmark {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 700; letter-spacing: 0.02em; font-size: 1.15rem;
    }
    .topbar .sub { color: #9fb0bd; font-size: 0.85rem; }
    .topbar a { color: #cfe0ee; text-decoration: none; margin-left: auto; font-size: 0.85rem; }
    .topbar a:hover { text-decoration: underline; }
    #swagger-ui .topbar { display: none; } /* swagger-ui ships its own topbar; ours replaces it */
  </style>
</head>
<body>
  <div class="topbar">
    <span class="wordmark">TRANSACT</span>
    <span class="sub">API Docs</span>
    <a href="/ui/">Open dashboard &rarr;</a>
  </div>
  <div id="swagger-ui"></div>
  <script src="/docs-assets/5.32.15/swagger-ui-bundle.js"></script>
  <script src="/docs-assets/5.32.15/swagger-ui-standalone-preset.js"></script>
  <script>
    window.onload = function () {
      window.ui = SwaggerUIBundle({
        url: "/docs/openapi.yaml",
        dom_id: "#swagger-ui",
        presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
        layout: "StandaloneLayout",
        deepLinking: true,
        docExpansion: "list",
        tryItOutEnabled: true,
      });
    };
  </script>
</body>
</html>
