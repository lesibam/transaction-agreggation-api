server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/transact}
    username: ${SPRING_DATASOURCE_USERNAME:app}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
  # Only bootstrap-servers is read from spring.kafka.* — KafkaConsumerConfig and
  # KafkaProducerConfig both build their ConsumerFactory/ProducerFactory
  # explicitly (pinned TRUSTED_PACKAGES, explicit (de)serializers, the shared
  # Jackson2 ObjectMapper) and never consult Boot's autoconfigured
  # spring.kafka.consumer.*/producer.* properties. Do not add config here
  # expecting it to reach the consumer/producer — it won't; change the two
  # @Configuration classes instead. (See docs/principal_engineer_review_report.md M-01.)
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  mvc:
    problemdetails:
      enabled: true
  web:
    resources:
      # Boot's own /webjars/** and /** static mappings are unconditional -
      # they would serve the swagger-ui webjar (and anything later dropped
      # under src/main/resources/static/) regardless of app.docs.enabled /
      # app.ui.enabled. Off here; UiResourceConfig and DocsResourceConfig
      # (config/) register their own mappings, each behind its own
      # @ConditionalOnProperty, so the toggles are real.
      add-mappings: false

app:
  ui:
    # Serves the read-only web dashboard (ADR-013) at /ui/**. Disable for a
    # production deployment that doesn't want an internal tool reachable
    # alongside the API - the API itself (/v1/**) is unaffected either way.
    enabled: true
  docs:
    # Serves openapi.yaml + a swagger-ui viewer (ADR-014) at /docs/** and
    # /docs-assets/**. Independent of app.ui.enabled by design: some
    # deployments want API docs reachable for integrators even with the
    # internal dashboard switched off.
    enabled: true
  security:
    jwt-secret: ${APP_SECURITY_JWT_SECRET}
    jwt-issuer: transact
    jwt-audience: transact-api
  ingestion:
    interval-ms: ${APP_INGESTION_INTERVAL_MS:60000}
    retry-max-attempts: 3
    retry-backoff-ms: 500
  freshness:
    fresh-seconds: 300
    stale-seconds: 1800
  sources:
    # Single registry (ADR-011): drives both the ingestion pipeline and the
    # API's freshness/completeness metadata. Transport is config; payload
    # semantics live in code (SourceNormalizer strategies keyed by `normalizer`).
    # Kafka/S3/HTTP examples: see README "Sources" and ADR-011.
    registry:
      - id: SOURCE_A
        name: "Source A (bank feed)"
        enabled: true
        type: MOCK
        normalizer: source-a-v1
        mock:
          data-location: classpath:mock/source-a.json
      - id: SOURCE_B
        name: "Source B (card processor)"
        enabled: true
        type: MOCK
        normalizer: source-b-v1
        mock:
          data-location: classpath:mock/source-b.json
      - id: SOURCE_C
        name: "Source C (retail gateway)"
        enabled: true
        type: MOCK
        normalizer: source-c-v1
        mock:
          data-location: classpath:mock/source-c.json

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
